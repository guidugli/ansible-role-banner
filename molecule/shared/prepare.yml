---
- name: Prepare banner targets
  hosts: all
  gather_facts: false
  vars:
    managed_banner_targets:
      - /etc/motd
      - /etc/issue
      - /etc/issue.net
  tasks:
    - name: Seed placeholder files for managed banner targets
      ansible.builtin.copy:
        dest: "/tmp{{ item | regex_replace('^/etc', '') }}.seed"
        content: |
          placeholder content for {{ item }}
        mode: '0644'
      loop: "{{ managed_banner_targets }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - banner
        - config

    - name: Replace managed banner targets with symlinks before converge
      ansible.builtin.file:
        src: "/tmp{{ item | regex_replace('^/etc', '') }}.seed"
        dest: "{{ item }}"
        state: link
        force: true
      loop: "{{ managed_banner_targets }}"
      loop_control:
        label: "{{ item }}"
      tags:
        - banner
        - config
