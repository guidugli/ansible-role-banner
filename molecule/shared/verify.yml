---
- name: Verify banner role
  hosts: all
  gather_facts: false
  vars:
    banner_expected_targets:
      - path: /etc/motd
        expected_file: banner.txt
      - path: /etc/issue
        expected_file: banner.txt
      - path: /etc/issue.net
        expected_file: banner.txt
  tasks:
    - name: Gather stats for managed banner files
      ansible.builtin.stat:
        path: "{{ item.path }}"
        follow: false
      loop: "{{ banner_expected_targets }}"
      loop_control:
        label: "{{ item.path }}"
      register: banner_target_stats
      tags:
        - banner
        - validate

    - name: Assert managed banner files are regular files with expected attributes
      ansible.builtin.assert:
        that:
          - item.stat.exists | default(false)
          - item.stat.isreg | default(false)
          - not (item.stat.islnk | default(false))
          - item.stat.pw_name == 'root'
          - item.stat.gr_name == 'root'
          - item.stat.mode == '0644'
        quiet: true
        fail_msg: >-
          Banner target {{ item.stat.path | default('unknown') }} is missing,
          is not a regular file, remains a symlink, or has unexpected ownership or mode.
      loop: "{{ banner_target_stats.results }}"
      loop_control:
        label: "{{ item.stat.path | default('unknown') }}"
      tags:
        - banner
        - validate

    - name: Read deployed banner contents
      ansible.builtin.slurp:
        src: "{{ item.path }}"
      loop: "{{ banner_expected_targets }}"
      loop_control:
        label: "{{ item.path }}"
      register: deployed_banner_contents
      tags:
        - banner
        - validate

    - name: Assert deployed banner content matches role source
      ansible.builtin.assert:
        that:
          - >-
            (item.content | b64decode)
            ==
            lookup(
              'ansible.builtin.file',
              playbook_dir ~ '/../../files/' ~ item.item.expected_file,
              rstrip=false
            )
        quiet: true
        fail_msg: >-
          Banner target {{ item.source }} does not match
          files/{{ item.item.expected_file }}.
      loop: "{{ deployed_banner_contents.results }}"
      loop_control:
        label: "{{ item.source }}"
      tags:
        - banner
        - validate
