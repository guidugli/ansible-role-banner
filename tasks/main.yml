---
- name: Validate semantic role inputs
  ansible.builtin.import_tasks: assert.yml
  tags:
    - banner
    - validate

- name: Remove existing managed banner symlinks
  ansible.builtin.include_tasks: remove_symlink.yml
  loop:
    - path: /etc/motd
      enabled: "{{ banner_manage_motd }}"
    - path: /etc/issue
      enabled: "{{ banner_manage_issue }}"
    - path: /etc/issue.net
      enabled: "{{ banner_manage_issue_net }}"
  loop_control:
    label: "{{ item.path }}"
  when:
    - banner_remove_existing_symlinks | bool
    - item.enabled | bool
  tags:
    - banner
    - config

- name: Install configured banner files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.path }}"
    owner: "{{ banner_owner }}"
    group: "{{ banner_group }}"
    mode: "{{ banner_mode }}"
    backup: "{{ banner_backup }}"
  loop:
    - path: /etc/motd
      src: "{{ banner_motd_file }}"
      enabled: "{{ banner_manage_motd }}"
    - path: /etc/issue
      src: "{{ banner_issue_file }}"
      enabled: "{{ banner_manage_issue }}"
    - path: /etc/issue.net
      src: "{{ banner_issuenet_file }}"
      enabled: "{{ banner_manage_issue_net }}"
  loop_control:
    label: "{{ item.path }} <= {{ item.src }}"
  when: item.enabled | bool
  tags:
    - banner
    - config
